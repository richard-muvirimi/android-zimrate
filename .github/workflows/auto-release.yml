name: Auto Release on Version Change

on:
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [ release ]
    paths:
      - 'app/build.gradle'

jobs:
  check-version-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need full history to access tags and previous commit contents
          fetch-depth: 0

      - name: Ensure tags are fetched
        run: |
          git fetch --tags --force --prune

      - name: Extract current app versions (versionName/versionCode)
        id: current_version
        run: |
          set -e
          VERSION_NAME=$(grep -o 'versionName "[^"]*"' app/build.gradle | sed 's/versionName "//' | sed 's/"//' | head -1 || true)
          VERSION_CODE=$(grep -o 'versionCode [0-9]*' app/build.gradle | sed 's/versionCode //' | head -1 || true)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          # Back-compat single 'version' output uses versionName
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Current versionName: $VERSION_NAME"
          echo "Current versionCode: $VERSION_CODE"

      - name: Extract previous app versions from HEAD~1
        id: previous_version
        run: |
          set -e
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            PREV_NAME=$(git show HEAD~1:app/build.gradle | grep -o 'versionName "[^"]*"' | sed 's/versionName "//' | sed 's/"//' | head -1 || true)
            PREV_CODE=$(git show HEAD~1:app/build.gradle | grep -o 'versionCode [0-9]*' | sed 's/versionCode //' | head -1 || true)
          else
            PREV_NAME=""
            PREV_CODE=""
          fi
          echo "previous_name=$PREV_NAME" >> $GITHUB_OUTPUT
          echo "previous_code=$PREV_CODE" >> $GITHUB_OUTPUT
          # Back-compat single 'previous' output uses versionName
          echo "previous=$PREV_NAME" >> $GITHUB_OUTPUT
          echo "Previous versionName: $PREV_NAME"
          echo "Previous versionCode: $PREV_CODE"

      - name: Check if versionCode changed (release only on code bump)
        id: version_check
        run: |
          CURRENT_CODE="${{ steps.current_version.outputs.version_code }}"
          PREVIOUS_CODE="${{ steps.previous_version.outputs.previous_code }}"
          if [ -n "$CURRENT_CODE" ] && [ "$CURRENT_CODE" != "$PREVIOUS_CODE" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "VersionCode changed from '$PREVIOUS_CODE' to '$CURRENT_CODE'"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "VersionCode unchanged or invalid (no release)"
          fi

      - name: Compute tag name
        id: tag
        if: steps.version_check.outputs.changed == 'true'
        run: |
          NAME="${{ steps.current_version.outputs.version_name }}"
          CODE="${{ steps.current_version.outputs.version_code }}"
          TAG="v${NAME}+${CODE}"
          echo "value=$TAG" >> $GITHUB_OUTPUT
          echo "Tag to use: $TAG"

      - name: Check if tag already exists
        id: tag_check
        if: steps.version_check.outputs.changed == 'true'
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist"
          fi


      - name: Generate changelog
        id: changelog
        if: steps.version_check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Version bump to ${{ steps.current_version.outputs.version_name }} (code ${{ steps.current_version.outputs.version_code }})"
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.version_check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          release_name: Release ${{ steps.current_version.outputs.version_name }} (code ${{ steps.current_version.outputs.version_code }})
          body: |
            ## Changes in ${{ steps.current_version.outputs.version_name }} (code ${{ steps.current_version.outputs.version_code }})
            
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

